<line class="arr" x1="262" y1="280" x2="286" y2="280" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="394" y1="280" x2="418" y2="280" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="262" y1="392" x2="286" y2="392" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="394" y1="392" x2="418" y2="392" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<!-- dikey -->
<line class="arr" x1="180" y1="304" x2="180" y2="368" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
