<!-- Etik filtre sınırı + Katman 3 -->
<rect class="f" x="138" y="170" width="404" height="386" rx="12"/>
<rect class="g" x="146" y="184" width="388" height="364" rx="12"/>
<text class="th" x="340" y="200">3. katman: şirketin amaçları ve sonuçları</text>
<text class="tm" x="340" y="217">kâr, maliyet, pazar payı, memnuniyet</text>

<!-- Malzeme akışı (altta, kalın mavi bant): Satın alma → Ambar → Üretim -->
<line class="mat" x1="304" y1="304" x2="215" y2="368"/>
<line class="mat" x1="340" y1="304" x2="340" y2="368"/>

<!-- Departmanlar arası 15 çift yönlü etkileşim -->
