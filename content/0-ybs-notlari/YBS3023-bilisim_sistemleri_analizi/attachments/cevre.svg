<svg viewBox="0 0 680 725" width="100%" height="auto" role="img" aria-label="Üç iç içe katman: uzak dış çevre, yakın dış çevre ve şirketin amaçları. Altı departman birbiriyle çift yönlü etkileşimde, tabanda iş ahlakı kolonu." xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    svg {
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
      user-select: none;
      --tx: #1e293b; --ta: #0f172a; --tm: #64748b;
      --gf: #f8fafc; --gs: #cbd5e1; --wf: #ffffff;
      --af: #fef3c7; --ac: #f59e0b; --ah: #b45309; --as: #92400e;
      --ln: #64748b; --mat: #0ea5e9;
    }
    .theme-dark svg {
      --tx: #e2e8f0; --ta: #f8fafc; --tm: #94a3b8;
      --gf: #1e293b; --gs: #334155; --wf: #0f172a;
      --af: #451a03; --ac: #d97706; --ah: #fbbf24; --as: #fde68a;
      --ln: #94a3b8; --mat: #38bdf8;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.theme-light) svg {
        --tx: #e2e8f0; --ta: #f8fafc; --tm: #94a3b8;
        --gf: #1e293b; --gs: #334155; --wf: #0f172a;
        --af: #451a03; --ac: #d97706; --ah: #fbbf24; --as: #fde68a;
        --ln: #94a3b8; --mat: #38bdf8;
      }
    }
    text { text-anchor: middle; dominant-baseline: central; font-size: 11px; fill: var(--tx); }
    .th { font-weight: 600; font-size: 11.5px; fill: var(--ta); }
    .tm { font-size: 10px; fill: var(--tm); }
    .ah { font-weight: 700; font-size: 12px; fill: var(--ah); }
    .as { font-size: 10px; fill: var(--as); }
    .st { text-anchor: start; fill: var(--tm); }
    .g { fill: var(--gf); stroke: var(--gs); stroke-width: 1.5; }
    .w { fill: var(--wf); stroke: var(--gs); stroke-width: 1.2; }
    .a { fill: var(--af); stroke: var(--ac); stroke-width: 1.5; }
    .f { fill: none; stroke: var(--ac); stroke-width: 1.5; stroke-dasharray: 4, 3; }
    .arr { stroke: var(--ln); stroke-width: 1.2; fill: none; }
    .mat { stroke: var(--mat); stroke-width: 6; fill: none; opacity: .45; }
    .col { stroke: var(--ac); stroke-width: 3; stroke-dasharray: 3, 2; }
    .dl { stroke: var(--ac); stroke-width: 2; stroke-dasharray: 4, 3; }
    #arrow path { stroke: var(--ln); }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Katman 1: Uzak Dış Çevre -->
<rect class="g" x="8" y="8" width="664" height="672" rx="20"/>
<text class="th" x="340" y="23">1. katman: uzak dış çevre (makro, kontrol edilemez)</text>

<rect class="w" x="24" y="38" width="204" height="34" rx="6"/><text x="126" y="55">Politik çevre</text>
<rect class="w" x="238" y="38" width="204" height="34" rx="6"/><text x="340" y="55">Yasal ve hukuki çevre</text>
<rect class="w" x="452" y="38" width="204" height="34" rx="6"/><text x="554" y="55">Eğitim sistemi ve bilim</text>

<rect class="w" x="16" y="230" width="94" height="60" rx="6"/>
<text x="63" y="245">Askerî ve</text><text x="63" y="260">jeopolitik</text><text x="63" y="275">güvenlik</text>
<rect class="w" x="16" y="420" width="94" height="60" rx="6"/>
