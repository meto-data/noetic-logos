<text x="617" y="442">Teknolojik</text><text x="617" y="458">çevre</text>

<rect class="w" x="24" y="634" width="306" height="34" rx="6"/><text x="177" y="651">Sosyo-kültürel çevre ve demografi</text>
<rect class="w" x="340" y="634" width="316" height="34" rx="6"/><text x="498" y="651">Ekolojik / doğal çevre</text>

<!-- Katman 1 ↔ 2 okları -->
<line class="arr" x1="200" y1="74" x2="200" y2="94" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="74" x2="340" y2="94" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="480" y1="74" x2="480" y2="94" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="111" y1="260" x2="131" y2="260" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="111" y1="450" x2="131" y2="450" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="549" y1="260" x2="569" y2="260" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="549" y1="450" x2="569" y2="450" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="240" y1="612" x2="240" y2="632" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="440" y1="612" x2="440" y2="632" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Katman 2: Yakın Dış Çevre -->
<rect class="w" x="132" y="96" width="416" height="514" rx="16"/>
<text class="th" x="340" y="110">2. katman: yakın dış çevre (mikro, görev)</text>
<rect class="g" x="144" y="122" width="124" height="30" rx="6"/><text x="206" y="137">Müşteriler</text>
