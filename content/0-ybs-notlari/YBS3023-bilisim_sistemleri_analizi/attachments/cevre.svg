<path class="arr" d="M210 256 C210 230 470 230 470 256" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="arr" d="M225 416 C225 450 455 450 455 416" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Departmanlar -->
<rect class="w" x="156" y="258" width="104" height="44" rx="6"/><text class="th" x="208" y="274">Pazarlama</text><text class="tm" x="208" y="291">sipariş, CRM</text>
<rect class="w" x="288" y="258" width="104" height="44" rx="6"/><text class="th" x="340" y="274">Ambar</text><text class="tm" x="340" y="291">stok dosyası</text>
<rect class="w" x="420" y="258" width="104" height="44" rx="6"/><text class="th" x="472" y="274">Finansman</text><text class="tm" x="472" y="291">nakit, fonlar</text>
<rect class="w" x="156" y="370" width="104" height="44" rx="6"/><text class="th" x="208" y="386">Satın alma</text><text class="tm" x="208" y="403">satıcı dosyası</text>
<rect class="w" x="288" y="370" width="104" height="44" rx="6"/><text class="th" x="340" y="386">Üretim</text><text class="tm" x="340" y="403">MPS, tezgâhlar</text>
<rect class="w" x="420" y="370" width="104" height="44" rx="6"/><text class="th" x="472" y="386">Muhasebe</text><text class="tm" x="472" y="403">çift kayıt</text>

