<body>
    <script>
       var kullanici=prompt("sayı giriniz:");
       document.write(Math.abs(kullanici));

 document.write(Math.floor(kullanici));

 document.write(Math.max(10,20,55,78));
  document.write(Math.sqrt(kullanici));
   document.write(Math.random(0,8));
 
 
    </script>
