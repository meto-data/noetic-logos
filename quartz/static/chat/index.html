<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noetic Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1a1a1a;
      padding: 1rem;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.2rem;
      color: #4a9eff;
    }

    .header .back-btn {
      background: #333;
      color: #e0e0e0;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }

    .header .back-btn:hover {
      background: #444;
    }

    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background: #1a1a1a;
      border-right: 1px solid #333;
      padding: 1rem;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .online-list {
      list-style: none;
    }

    .online-list li {
      padding: 0.3rem 0;
      font-size: 0.85rem;
      color: #4a9eff;
    }

    .online-list li::before {
      content: "●";
      color: #4ade80;
      margin-right: 0.5rem;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .message {
      max-width: 80%;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .message.user {
      background: #2563eb;
      align-self: flex-start;
    }

    .message.own {
      background: #059669;
      align-self: flex-end;
    }

    .message.system {
      background: #333;
      color: #888;
      align-self: center;
      font-size: 0.8rem;
      font-style: italic;
    }

    .message .nickname {
      font-weight: bold;
      font-size: 0.75rem;
      opacity: 0.8;
      margin-bottom: 0.2rem;
    }

    .message .time {
      font-size: 0.7rem;
      opacity: 0.6;
      margin-top: 0.2rem;
    }

    .input-area {
      background: #1a1a1a;
      padding: 1rem;
      border-top: 1px solid #333;
      display: flex;
      gap: 0.5rem;
    }

    .input-area input {
      flex: 1;
      background: #333;
      border: 1px solid #444;
      color: #e0e0e0;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .input-area input:focus {
      outline: none;
      border-color: #4a9eff;
    }

    .input-area button {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .input-area button:hover {
      background: #3b82f6;
    }

    .input-area button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    /* Join Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid #333;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h2 {
      margin-bottom: 1rem;
      color: #4a9eff;
    }

    .modal-content input {
      width: 100%;
      background: #333;
      border: 1px solid #444;
      color: #e0e0e0;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .modal-content input:focus {
      outline: none;
      border-color: #4a9eff;
    }

    .modal-content button {
      width: 100%;
      background: #4a9eff;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 1rem;
    }

    .modal-content button:hover {
      background: #3b82f6;
    }

    .modal-content .error {
      color: #ef4444;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .status {
      font-size: 0.8rem;
      color: #888;
      padding: 0.5rem 1rem;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }

    .status.connected {
      color: #4ade80;
    }

    .status.error {
      color: #ef4444;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Noetic Chat</h1>
    <a href="/" class="back-btn">← Siteye Dön</a>
  </div>

  <div class="status" id="status">Bağlanıyor...</div>

  <div class="main-container">
    <div class="sidebar">
      <h3>Çevrimiçi (<span id="online-count">0</span>)</h3>
      <ul class="online-list" id="online-list"></ul>
    </div>

    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Mesajınızı yazın..." maxlength="500" disabled>
        <button id="send-btn" disabled>Gönder</button>
      </div>
    </div>
  </div>

  <!-- Join Modal -->
  <div class="modal" id="join-modal">
    <div class="modal-content">
      <h2>Sohbete Katıl</h2>
      <div class="error" id="join-error" style="display: none;"></div>
      <input type="text" id="nickname-input" placeholder="Takma adınız..." maxlength="20" autofocus>
      <button id="join-btn">Katıl</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://noetic-presence.mselayet.workers.dev';
    const HEARTBEAT_INTERVAL = 30000; // 30 seconds
    const POLL_INTERVAL = 3000; // 3 seconds

    let sessionId = localStorage.getItem('chat_session_id');
    if (!sessionId) {
      sessionId = 'chat_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
      localStorage.setItem('chat_session_id', sessionId);
    }

    let nickname = localStorage.getItem('chat_nickname') || '';
    let lastMessageTimestamp = 0;
    let heartbeatTimer = null;
    let pollTimer = null;
    let isJoined = false;

    const statusEl = document.getElementById('status');
    const onlineCountEl = document.getElementById('online-count');
    const onlineListEl = document.getElementById('online-list');
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const joinModal = document.getElementById('join-modal');
    const nicknameInput = document.getElementById('nickname-input');
    const joinBtn = document.getElementById('join-btn');
    const joinError = document.getElementById('join-error');

    // Utility: Format time
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    }

    // API: Join chat
    async function joinChat(nick) {
      try {
        const res = await fetch(`${WORKER_URL}/chat/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, nickname: nick })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Katılım başarısız');
        }

        nickname = data.nickname;
        localStorage.setItem('chat_nickname', nickname);
        isJoined = true;
        return true;
      } catch (err) {
        throw err;
      }
    }

    // API: Send message
    async function sendMessage(msg) {
      try {
        const res = await fetch(`${WORKER_URL}/chat/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: msg })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Mesaj gönderilemedi');
        }

        return true;
      } catch (err) {
        console.error('Send error:', err);
        return false;
      }
    }

    // API: Get messages
    async function fetchMessages() {
      try {
        const res = await fetch(`${WORKER_URL}/chat/messages?since=${lastMessageTimestamp}`);
        const data = await res.json();

        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(msg => {
            addMessageToUI(msg);
            if (msg.timestamp > lastMessageTimestamp) {
              lastMessageTimestamp = msg.timestamp;
            }
          });
        }
      } catch (err) {
        console.error('Fetch messages error:', err);
      }
    }

    // API: Get online users
    async function fetchOnlineUsers() {
      try {
        const res = await fetch(`${WORKER_URL}/chat/online`);
        const data = await res.json();

        onlineCountEl.textContent = data.count;
        onlineListEl.innerHTML = '';

        data.users.forEach(user => {
          const li = document.createElement('li');
          li.textContent = user.nickname;
          onlineListEl.appendChild(li);
        });
      } catch (err) {
        console.error('Fetch online error:', err);
      }
    }

    // API: Heartbeat
    async function sendHeartbeat() {
      if (!isJoined) return;

      try {
        await fetch(`${WORKER_URL}/chat/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });
      } catch (err) {
        console.error('Heartbeat error:', err);
      }
    }

    // API: Leave chat
    async function leaveChat() {
      if (!isJoined) return;

      try {
        await fetch(`${WORKER_URL}/chat/leave`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });
      } catch (err) {
        console.error('Leave error:', err);
      }
    }

    // UI: Add message to chat
    function addMessageToUI(msg) {
      const div = document.createElement('div');
      div.className = 'message';

      if (msg.type === 'system') {
        div.classList.add('system');
        div.textContent = msg.message;
      } else {
        const isOwn = msg.nickname === nickname;
        div.classList.add(isOwn ? 'own' : 'user');

        div.innerHTML = `
          <div class="nickname">${msg.nickname}</div>
          <div class="text">${msg.message}</div>
          <div class="time">${formatTime(msg.timestamp)}</div>
        `;
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // UI: Handle join
    async function handleJoin() {
      const nick = nicknameInput.value.trim();
      if (!nick) {
        joinError.textContent = 'Takma ad gerekli';
        joinError.style.display = 'block';
        return;
      }

      joinBtn.disabled = true;
      joinBtn.textContent = 'Katılınıyor...';
      joinError.style.display = 'none';

      try {
        await joinChat(nick);
        joinModal.style.display = 'none';
        messageInput.disabled = false;
        sendBtn.disabled = false;
        statusEl.textContent = `Bağlı - ${nickname}`;
        statusEl.className = 'status connected';

        // Start polling and heartbeat
        startPolling();
        startHeartbeat();

        // Fetch initial data
        await fetchMessages();
        await fetchOnlineUsers();

        messageInput.focus();
      } catch (err) {
        joinError.textContent = err.message;
        joinError.style.display = 'block';
        joinBtn.disabled = false;
        joinBtn.textContent = 'Katıl';
      }
    }

    // UI: Handle send
    async function handleSend() {
      const msg = messageInput.value.trim();
      if (!msg) return;

      sendBtn.disabled = true;
      const success = await sendMessage(msg);

      if (success) {
        messageInput.value = '';
        await fetchMessages();
      }

      sendBtn.disabled = false;
      messageInput.focus();
    }

    // Timers
    function startPolling() {
      pollTimer = setInterval(async () => {
        await fetchMessages();
        await fetchOnlineUsers();
      }, POLL_INTERVAL);
    }

    function startHeartbeat() {
      heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_INTERVAL);
    }

    function stopTimers() {
      if (pollTimer) clearInterval(pollTimer);
      if (heartbeatTimer) clearInterval(heartbeatTimer);
    }

    // Event listeners
    joinBtn.addEventListener('click', handleJoin);
    nicknameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleJoin();
    });

    sendBtn.addEventListener('click', handleSend);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Leave on page unload
    window.addEventListener('beforeunload', () => {
      leaveChat();
      stopTimers();
    });

    // Auto-join if nickname exists
    if (nickname) {
      nicknameInput.value = nickname;
    }

    // Check connection
    fetch(`${WORKER_URL}/health`)
      .then(res => res.json())
      .then(() => {
        statusEl.textContent = 'Bağlantı hazır';
        statusEl.className = 'status';
      })
      .catch(() => {
        statusEl.textContent = 'Bağlantı hatası';
        statusEl.className = 'status error';
      });
  </script>
</body>
</html>
