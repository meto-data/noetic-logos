    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px
        }

        .greek-meander-bg {
            background-color: #f1f5f9;
            background-image:
                linear-gradient(45deg, #cbd5e1 25%, transparent 25%, transparent 75%, #cbd5e1 75%, #cbd5e1),
                linear-gradient(45deg, #cbd5e1 25%, transparent 25%, transparent 75%, #cbd5e1 75%, #cbd5e1);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            opacity: 0.3;
        }

        .sidebar-pillar {
            background: linear-gradient(90deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            border-right: 1px solid #cbd5e1;
            position: relative;
        }

        .dark .sidebar-pillar {
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            border-right: 1px solid #334155;
        }

        .scroll-paper {
            background-color: #EBF5FB;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            position: relative;
            border-top: 12px solid #5499C7;
            border-bottom: 12px solid #5499C7;
            border-radius: 2px;
        }

        .dark .scroll-paper {
            background-color: #1e293b;
            border-top-color: #3b82f6;
            border-bottom-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        .scroll-paper::before,
        .scroll-paper::after {
            content: "";
            position: absolute;
            left: -12px;
            width: 24px;
            height: 20px;
            background: #2471A3;
            border-radius: 12px;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
            z-index: 10;
            background: radial-gradient(circle at 30% 30%, #AED6F1, #2471A3);
        }

        .dark .scroll-paper::before,
        .dark .scroll-paper::after {
            background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af);
        }

        .scroll-paper::before {
            top: -16px;
        }

        .scroll-paper::after {
            bottom: -16px;
        }

        .scroll-handle-right-top {
            position: absolute;
            right: -12px;
            top: -16px;
            width: 24px;
            height: 20px;
            border-radius: 12px;
            box-shadow: -2px 2px 4px rgba(0, 0, 0, 0.4);
            z-index: 10;
            background: radial-gradient(circle at 30% 30%, #AED6F1, #2471A3);
        }

        .dark .scroll-handle-right-top {
            background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af);
        }

        .scroll-handle-right-bottom {
            position: absolute;
            right: -12px;
            bottom: -16px;
            width: 24px;
            height: 20px;
            border-radius: 12px;
            box-shadow: -2px 2px 4px rgba(0, 0, 0, 0.4);
            z-index: 10;
            background: radial-gradient(circle at 30% 30%, #AED6F1, #2471A3);
        }

        .dark .scroll-handle-right-bottom {
            background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af);
        }

        /* Hide scroll handles on mobile */
        @media (max-width: 1023px) {

            .scroll-handle-right-top,
            .scroll-handle-right-bottom,
            .scroll-paper::before,
            .scroll-paper::after {
                display: none !important;
            }
        }

        .code-editor-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Prism overrides */
        pre {
            border-radius: 0.5rem !important;
            margin: 1rem 0 !important;
        }

        code {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.9em;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in.slide-in-from-bottom-4 {
            animation: slideInUp 0.5s ease-out forwards;
        }

<body class="text-slate-800 dark:text-white antialiased bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>
    <script>
        // Global event delegation for copy buttons (inline onclick doesn't work with dangerouslySetInnerHTML)
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.copy-code-btn');
            if (btn) {
                const wrapper = btn.closest('.code-block-wrapper');
                const code = wrapper ? wrapper.querySelector('code') : null;
                if (code) {
                    navigator.clipboard.writeText(code.textContent).then(function () {
                        btn.innerHTML = '<span class="material-symbols-outlined text-xs">check</span>';
                        setTimeout(function () {
                            btn.innerHTML = '<span class="material-symbols-outlined text-xs">content_copy</span>';
                        }, 2000);
                    });
                }
            }
        });
    </script>
