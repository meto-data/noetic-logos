<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noetic Logos</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font: 16px/1.5 system-ui, sans-serif;
      }

      main {
        max-width: 28rem;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 20px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #e2e8f0;
        }

        main {
          background: rgba(15, 23, 42, 0.92);
          border-color: rgba(100, 116, 139, 0.45);
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Noetic Logos</h1>
      <p>Baglanti kuruldugunda notlar canli siteden yuklenecek.</p>
    </main>
  </body>
</html>
